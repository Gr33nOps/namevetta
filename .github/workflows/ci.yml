name: CI

on:
  push:
    branches: [main]
    # Docs and image-only changes cannot break the build or the tests, so they
    # do not need to trigger the full gate.
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**', 'LICENSE']

# Cancel an in-progress run when a newer commit lands on the same branch or PR,
# so a second push does not queue behind the first, now superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on a self-hosted runner (a developer machine registered to this repo),
# so CI costs no GitHub Actions minutes — the full gate runs for free even on a
# private repo. `npm test` includes the golden dataset, so a change that starts
# missing real conflicts fails the build rather than merging quietly (§54).
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests and quality benchmark
        run: npm test

      # Fails only on a high or critical advisory in a production dependency.
      # Dev-only and lower-severity advisories are left to Dependabot rather than
      # blocking a merge, so this gate stays signal, not noise.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # The build must succeed with no credentials. Sources that need a key
          # report `unable_to_verify` and coverage drops — the product degrades,
          # it does not break.
          NEXT_TELEMETRY_DISABLED: '1'

  # Separate from `verify`, and deliberately not a dependency of it. A real
  # browser against a real dev server can fail for reasons a unit test cannot
  # (a slow cold start, a flaky click); keeping the jobs separate means a
  # browser hiccup never hides a genuine unit-test result, and the reverse.
  e2e:
    runs-on: self-hosted
    # A stalled run should fail in minutes, not sit for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The runner machine keeps the browser between runs, so this verifies and
      # skips rather than downloading Chromium every time.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Only on failure: Playwright writes no HTML report on a green run, so an
      # unconditional upload warned "no files were found" every time.
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
